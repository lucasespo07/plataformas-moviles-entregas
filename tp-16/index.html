<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Países del mundo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="api2.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-3">Países del mundo</h1>

        <p class="text-center mb-4">
            Conocé información de diferentes países del mundo.
        </p>

        <!-- Buscador -->
        <div class="row mb-3">

            <div class="col-md-6 mx-auto">

                <input
                    type="text"
                    id="buscador"
                    class="form-control"
                    placeholder="Buscar un país..."
                >

            </div>

        </div>

        <!-- Spinner -->
        <div id="spinner" class="text-center my-5">

            <div class="spinner-border text-primary"></div>

            <p class="mt-2">Cargando países...</p>

        </div>

        <!-- Mensaje -->
        <p id="mensaje" class="text-center"></p>

        <!-- Tarjetas de países -->
        <div id="contenedorPaises" class="row g-4">

        </div>

    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="api2.js"></script>

</body>
</html>
